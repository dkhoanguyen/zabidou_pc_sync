[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pc_generation"
version = "0.1.0"
description = "Point-cloud capture from Lucid Vision cameras via the Arena SDK"
requires-python = ">=3.10"
dependencies = [
    "arena-api>=2.8.4",
    "numpy>=1.24",
    "opencv-python>=4.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.ruff]
line-length = 100
target-version = "py310"
